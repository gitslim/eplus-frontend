apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: energyplus-frontend
  name: energyplus-frontend
  namespace: energyplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energyplus-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: energyplus-frontend
    spec:
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: VITE_BITRIX_HOOK_URL
              valueFrom:
                secretKeyRef:
                  name: energyplus
                  key: VITE_BITRIX_HOOK_URL
          image: slim777/eplus-frontend
          imagePullPolicy: Always
          name: energyplus-frontend
          resources:
            limits:
              cpu: "1"
              memory: 2048Mi
            requests:
              cpu: 100m
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      #      imagePullSecrets:
      #        - name: global-secret
      # SSR (SvelteKit) ходит в Strapi по публичному URL https://api.<домен>/graphql
      # (запечён в образ на этапе сборки, website.js). hostAliases резолвит этот
      # hostname внутри пода напрямую в ClusterIP traefik (тот же TLS-сертификат):
      # рендер страниц не зависит от внешнего DNS и не ходит hairpin-ом через
      # публичный IP. Внешние клиенты (браузеры, API-потребители) не затронуты.
      # Первопричина 503 CMS-страниц 2025-2026 — флап Google-DNS на ноде, апстримы
      # переведены на 77.88.8.8 — runbook: eplus-backend#4.
      # Если traefik будет пересоздан и получит новый ClusterIP — обновить IP здесь
      # и в живом deployment (kubectl -n energyplus patch deployment energyplus-frontend).
      hostAliases:
        - ip: 10.43.39.85
          hostnames:
            - api.xn--c1adkmgpem4hrai.xn--p1ai
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
